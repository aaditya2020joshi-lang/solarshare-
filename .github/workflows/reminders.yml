name: Check reminders

# Vercel's free plan only runs the built-in cron once a day, so this pings the
# reminder check every 5 minutes. GitHub may delay scheduled runs by a few minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminder check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://human-insights.vercel.app/api/cron/check-reminders
          else
            curl -fsS --max-time 60 https://human-insights.vercel.app/api/cron/check-reminders
          fi
