name: Check reminders

# Vercel's free plan only runs the built-in cron once a day, so this pings the
# reminder check every 5 minutes. GitHub may delay scheduled runs by a few minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminder check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL=https://human-insights.vercel.app/api/cron/check-reminders
          if [ -z "$CRON_SECRET" ]; then echo "Note: the CRON_SECRET secret is empty in GitHub."; fi
          STATUS=$(curl -sS --max-time 60 -o response.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$URL")
          echo "HTTP status: $STATUS"
          echo "Response: $(cat response.txt)"
          if [ "$STATUS" = "401" ]; then echo "401 means the CRON_SECRET in GitHub does not match the one set in Vercel."; fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then exit 1; fi
